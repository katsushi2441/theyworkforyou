# このワークスペースの決まりに合わせた上書き。本体の docker-compose.yml は変えない
# （上流を追いかけるときに衝突させないため）。
#
# ポートは 18300番台の空きを ss -ltn で実測して取る。
# **ドキュメントの「未使用」表記は信用しない。** 2026-09-27 に 18384/18385/18386 を
# 取ろうとして、すでに他サービスが握っていて起動に失敗した。実測し直して下の番号にした。
# Redis 6379・Sentinel 26379・MailHog 1025/8025 は既定のままだと他とぶつかるので
# すべて 127.0.0.1 に閉じ、18300番台へ寄せる。
services:
  twfy:
    ports: !override
      - "127.0.0.1:18383:80"
  redis:
    ports: !override
      - "127.0.0.1:18387:6379"
  sentinel:
    ports: !override
      - "127.0.0.1:18388:26379"
  mailhog:
    ports: !override
      - "127.0.0.1:18389:1025"
      - "127.0.0.1:18391:8025"
