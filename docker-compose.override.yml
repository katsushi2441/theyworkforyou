# このワークスペースの決まりに合わせた上書き。本体の docker-compose.yml は変えない
# （上流を追いかけるときに衝突させないため）。
#
# ポートは 18300番台の空きを ss -ltn で実測して取る。
# **ドキュメントの「未使用」表記は信用しない。** 2026-09-27 に 18384/18385/18386 を
# 取ろうとして、すでに他サービスが握っていて起動に失敗した。実測し直して下の番号にした。
# Redis 6379・Sentinel 26379・MailHog 1025/8025 は既定のままだと他とぶつかるので
# すべて 127.0.0.1 に閉じ、18300番台へ寄せる。
services:
  twfy:
    ports: !override
      - "127.0.0.1:18383:80"
  # 付属品（Redis・Sentinel・MailHog）はホストへ出さない（2026-10-30）。twfy とは compose の内部ネットワークで
  # 名前（redis / sentinel / mailhog）でつながるので、ホスト側の番号は要らない。18300番台が埋まったので空けた。
  # MailHog の画面（8025）を見たいときは、一時的に ports を戻して docker compose up -d mailhog する。
  redis:
    ports: !reset []
  sentinel:
    ports: !reset []
  mailhog:
    ports: !reset []
